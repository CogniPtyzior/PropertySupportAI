[project]
name = "property-support-genai"
version = "0.1.0"
description = "PropertySupport AI - production-like GenAI workflow assistant for property support teams"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-ollama>=0.2.0",
  "langfuse>=2.50.0",
  "rapidfuzz>=3.9.0",
  "python-dotenv>=1.0.0",
  "orjson>=3.10.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "httpx>=0.27.0",
  "freezegun>=1.5.0",
  "ruff>=0.5.0",
  "pyright>=1.1.370",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "ollama: tests requiring a running local Ollama server",
  "integration: integration tests",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["app", "tests", "scripts"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "docs*", "http*", "scripts*", "tests*"]

[tool.setuptools.package-data]
app = ["prompts/*.md"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
